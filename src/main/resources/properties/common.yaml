# HTTP REQUEST CONFIG
systemapi:
  azuresql:
    basePath: "/api/v1"
    v2:
      basePath: "/api/v2"
    path:
      account:
        accountDetailsByUserId: "/account" # /{userId}
        accountDetailsMatch: "/account/match"
        accountStatusSync: "/account/status"
        notifications:
          accountNotifications: "/account/notifications" # /{userId}
          #accountNotificationById: "/account/notifications/{userId}/id/{notificationId}"
          #accountNotificationsAuditById: "/account/notifications/{userId}/audit/{notificationId}"
          admin:
            accountNotifications: "/account/notifications/admin"
        termsAndConditions: "/account/termsandconditions" #/{userId}
        register:
          portal: "/account/register/portal"
          oneoffsearch: "/account/register/oneoffsearch"
          annual: "/account/register/annual"
          users: "/account/register/users"
      categories: "/categories"
      #categoryById: "/categories/{categoryid}"
      organisation: "/organisations"
      emailDomains: "/organisations/emaildomains"
      content: "/content/tcagreements"
      #getContentById: "/content/tcagreements/{tcId}"
      #contactManagement: "/organisations/{orgId}/contacts"
      #organisationDetailsById: "/organisation/{orgId}"
      #branchListByOrgId: "/organisation/{orgId}/branch"
      documents:
        "documentTypeList": "/documents/list"
      admin:
        orgDetails: "/admin/organisations"
        userDetails: "/admin/users"
        userNameByUserId: "/admin/user"
        sftpUser: "/admin/users/sftp"
        vrm: "/admin/management/vrms"
      support:
        updateTicket: "/support"
  utility:
    basePath: "/api/v1"
    notifications:
      path:
        email: "/notifications/email"
    ukvehicledata:
      path:
        addresses: "/ukvehicledata/addresses"
        #postcodeLookup: "/addresses/{postcode}"
    servicenow:
      path:
        tickets: "/servicenow/cases/support"
        orgCaseDetails: "/servicenow/cases/registration" # /{caseId}
        #ticketDetails: "/servicenow/cases/support/{ticketId}"
        tcAcceptance: "/servicenow/cases/registration/tcacceptance"
    okta:
      path:
        users: "/okta/users"
        token: "/okta/token"
        refreshToken: "/okta/token/refresh"
        revokeToken: "/okta/token/revoke"
        addGroupToUser: "/okta/users/{userId}/navigategroup"
        setPassword: "/okta/users/{userId}/setpassword"
        getUserOktaApps: "okta/users/{userId}/apps"
    adls:
      path:
        documents: "/adls/documents"
        documentsBatch: "/adls/documents/batch"
    google:
      path:
        recaptcha: "/google/recaptcha"
    anypoint:
      path:
        createClientApps: "/anypoint/clientapp"
        #apiDetails: "/anypoint/apis/{apiName}/environment/{environment}"
        apiDetails: "/anypoint/apis"
    sftp:
      path:
        users: "/sftp/localuser"
        sftpSshKeys: "/sftp/sshkeys"
    microsoft:
      path:
        token: "/microsoft/token"
    powerbi:
      path:
        reports: "/powerbi/reports"
